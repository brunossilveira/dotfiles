# herdr configuration — https://herdr.dev/docs/configuration/
# Linked to ~/.config/herdr/config.toml by link.sh.
# Mirrors config/tmux.conf: same prefix, same split/pane keys, same palette.
# Run `herdr config check` after editing; `herdr --default-config` dumps every option.

[theme]
# tmux.conf uses the Solarized 256 palette
name = "solarized"

[keys]
# C-a instead of C-b, like tmux
prefix = "ctrl+a"

# Splits match tmux: | side by side, - stacked
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# Pane focus (prefix+hjkl) and navigate mode (hjkl) already match tmux by default.
# tmux resizes with prefix+HJKL; herdr uses a resize mode instead (prefix+r, then hjkl).

[ui]
# tmux keeps its status bar at the bottom
tab_bar_position = "bottom"

# One tab per workspace is the norm with hacktopus (each session is a
# workspace), so the row is noise until a workspace actually has several.
hide_tab_bar_when_single_tab = true

# tmux highlights the active window in Solarized orange (colour166)
accent = "#cb4b16"

[ui.toast]
# tmux runs monitor-activity + visual-activity: alerts show in-app, not on the desktop
delivery = "herdr"

[session]
# tmux-resurrect/tmux-continuum restore sessions; herdr does it natively
resume_agents_on_restore = true

[ui.sidebar.spaces]
# hacktopus (--mux herdr) publishes $hk_group once per repo and indents session
# labels, so sessions read as a list under their repo. herdr drops a row whose
# tokens are empty, which is what turns the first row into a heading; the second
# row is the workspace label (indented for sessions, plain for your own spaces).
# The repo heading is Solarized blue so it reads apart from the session names,
# which keep the contextual default.
rows = [
  [{ token = "$hk_group", fg = "#268bd2", bold = true }],
  ["workspace"],
]

# >>> hacktopus (managed) >>>
# Written by hacktopus; edits inside are overwritten.

# new session (shadows next_tab)
[[keys.command]]
key = "prefix+n"
type = "popup"
command = "hacktopus session new --mux herdr"
width = "70%"
height = "70%"

# find a session (revives dead ones)
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "hacktopus session switch --mux herdr"
width = "70%"
height = "70%"
# <<< hacktopus (managed) <<<
