# Codex CLI configuration — symlinked to ~/.codex/config.toml by link.sh.
# Reference: https://learn.chatgpt.com/docs/config-file/config-reference
#
# Global instructions come from .codex/AGENTS.md (symlink -> .claude/CLAUDE.md).
# Hooks live in .codex/hooks.json; skills come from .codex/skills -> .claude/skills
# plus the command-derived ones in .agents/skills.
#
# Codex rewrites this file at runtime and drops every comment below the header,
# along with machine-local state ([projects.*] trust records, [hooks.state.*]
# hashes, and onboarding flags). Those lines show up in git diff — discard them
# unless you actually want them on every machine.

