# Quality checks by language and stage.
#
#   <language>|<stage>|<tool>|<probe>|<command>
#
# The probe decides whether the tool is installed in the repository being
# worked. Precedence is deliberate:
#
#   1. A `.swarm.conf` at the repo root wins outright.
#   2. A language with entries for this stage is checked by those tools. If one
#      is defined but not installed, the run stops and says so — it never falls
#      back to an opinion, because a deterministic bar exists here.
#   3. Only a language with no entries for this stage falls back to an agent
#      judging against reference/check-rubrics/<stage>.md.
#
# Commands run in the story's worktree, in file order, stopping at the first
# failure — so coverage runs before anything that reads coverage.

# --- clojure — the bar swarm-forge set: CRAP <= 6 on real LCOV, DRY, mutants killed
clojure|implementation|bb|command -v bb|bb test
clojure|implementation|dependency-checker|command -v check-dependencies|check-dependencies
clojure|cleanup|bb|command -v bb|bb coverage
clojure|cleanup|crap4clj|command -v crap|crap --max 6
clojure|cleanup|dry4clj|command -v deintroverter|deintroverter --check
clojure|cleanup|dependency-checker|command -v check-dependencies|check-dependencies
clojure|hardening|bb|command -v bb|bb coverage
clojure|hardening|crap4clj|command -v crap|crap --max 6
clojure|hardening|clj-mutate|command -v mutate|mutate --reuse-lcov
clojure|hardening|dry4clj|command -v deintroverter|deintroverter --check
clojure|senior-implementation|bb|command -v bb|bb test

# --- ruby
ruby|implementation|rspec|bundle exec rspec --version|bundle exec rspec
ruby|implementation|rubocop|bundle exec rubocop --version|bundle exec rubocop --force-exclusion
ruby|cleanup|rspec|bundle exec rspec --version|bundle exec rspec
ruby|cleanup|rubocop|bundle exec rubocop --version|bundle exec rubocop --force-exclusion
ruby|cleanup|flay|bundle exec flay --help|bundle exec flay --mass 25 .
ruby|cleanup|flog|bundle exec flog --help|bundle exec flog -m -t 25 .
ruby|hardening|rspec|bundle exec rspec --version|bundle exec rspec
ruby|hardening|mutant|bundle exec mutant --version|bundle exec mutant run --since HEAD~1
ruby|senior-implementation|rspec|bundle exec rspec --version|bundle exec rspec

# --- javascript / typescript
javascript|implementation|npm-test|npm test --help|npm test
javascript|implementation|eslint|npx --no-install eslint --version|npx --no-install eslint .
javascript|cleanup|npm-test|npm test --help|npm test
javascript|cleanup|eslint|npx --no-install eslint --version|npx --no-install eslint .
javascript|cleanup|jscpd|npx --no-install jscpd --version|npx --no-install jscpd --threshold 5 .
javascript|hardening|npm-test|npm test --help|npm test
javascript|hardening|stryker|npx --no-install stryker --version|npx --no-install stryker run
javascript|senior-implementation|npm-test|npm test --help|npm test

# --- python
python|implementation|pytest|pytest --version|pytest
python|implementation|ruff|ruff --version|ruff check .
python|cleanup|pytest|pytest --version|pytest
python|cleanup|ruff|ruff --version|ruff check .
python|cleanup|radon|radon --version|radon cc -n C -a .
python|hardening|pytest|pytest --version|pytest
python|hardening|mutmut|mutmut --version|mutmut run
python|senior-implementation|pytest|pytest --version|pytest

# --- go
go|implementation|go|command -v go|go test ./...
go|implementation|go-vet|command -v go|go vet ./...
go|cleanup|go|command -v go|go test ./...
go|cleanup|gocyclo|command -v gocyclo|gocyclo -over 15 .
go|cleanup|dupl|command -v dupl|dupl -threshold 50 .
go|hardening|go-race|command -v go|go test -race ./...
go|senior-implementation|go|command -v go|go test ./...

# --- rust
rust|implementation|cargo|command -v cargo|cargo test
rust|implementation|clippy|cargo clippy --version|cargo clippy -- -D warnings
rust|cleanup|cargo|command -v cargo|cargo test
rust|cleanup|clippy|cargo clippy --version|cargo clippy -- -D warnings
rust|hardening|cargo|command -v cargo|cargo test
rust|senior-implementation|cargo|command -v cargo|cargo test

# --- elixir
elixir|implementation|mix|command -v mix|mix test
elixir|cleanup|mix|command -v mix|mix test
elixir|cleanup|credo|mix help credo|mix credo --strict
elixir|hardening|mix|command -v mix|mix test
elixir|senior-implementation|mix|command -v mix|mix test

# --- shell
shell|implementation|shellcheck|command -v shellcheck|shellcheck $(git ls-files '*.sh')
shell|cleanup|shellcheck|command -v shellcheck|shellcheck $(git ls-files '*.sh')
