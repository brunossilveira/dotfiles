# Quality checks by language and stage.
#
#   <language>  <stage>  <probe> || <command>
#
# The probe decides whether the tool is actually installed in the repository
# being worked; only then does the command run. A stage with no usable tool
# falls back to an agent judging against reference/check-rubrics/<stage>.md.
#
# Repositories override all of this with a `.swarm.conf` at their root:
#   check <stage> <command...>
#   skip  <stage>

# --- ruby -------------------------------------------------------------------
ruby  implementation  bundle exec rspec --version              || bundle exec rspec
ruby  implementation  bundle exec rubocop --version            || bundle exec rubocop --force-exclusion
ruby  cleanup         bundle exec rspec --version              || bundle exec rspec
ruby  cleanup         bundle exec rubocop --version            || bundle exec rubocop --force-exclusion
ruby  cleanup         bundle exec flay --help                  || bundle exec flay --mass 25 app lib
ruby  cleanup         bundle exec flog --help                  || bundle exec flog -m -t 25 app lib
ruby  hardening       bundle exec rspec --version              || bundle exec rspec
ruby  hardening       bundle exec mutant --version             || bundle exec mutant run --since HEAD~1
ruby  senior-implementation  bundle exec rspec --version       || bundle exec rspec

# --- javascript / typescript ------------------------------------------------
javascript  implementation  npm test --help                    || npm test
javascript  implementation  npx --no-install eslint --version  || npx --no-install eslint .
javascript  cleanup         npm test --help                    || npm test
javascript  cleanup         npx --no-install eslint --version  || npx --no-install eslint .
javascript  cleanup         npx --no-install jscpd --version   || npx --no-install jscpd --threshold 5 .
javascript  hardening       npm test --help                    || npm test
javascript  senior-implementation  npm test --help             || npm test

# --- python -----------------------------------------------------------------
python  implementation  pytest --version                       || pytest
python  implementation  ruff --version                         || ruff check .
python  cleanup         pytest --version                       || pytest
python  cleanup         ruff --version                         || ruff check .
python  cleanup         radon --version                        || radon cc -n C -a .
python  hardening       pytest --version                       || pytest
python  hardening       mutmut --version                       || mutmut run
python  senior-implementation  pytest --version                || pytest

# --- go ---------------------------------------------------------------------
go  implementation  command -v go                              || go test ./...
go  implementation  command -v go                              || go vet ./...
go  cleanup         command -v go                              || go test ./...
go  cleanup         command -v gocyclo                         || gocyclo -over 15 .
go  cleanup         command -v dupl                            || dupl -threshold 50 .
go  hardening       command -v go                              || go test -race ./...
go  senior-implementation  command -v go                       || go test ./...

# --- rust -------------------------------------------------------------------
rust  implementation  command -v cargo                         || cargo test
rust  implementation  command -v cargo                         || cargo clippy -- -D warnings
rust  cleanup         command -v cargo                         || cargo test
rust  cleanup         command -v cargo                         || cargo clippy -- -D warnings
rust  hardening       command -v cargo                         || cargo test
rust  senior-implementation  command -v cargo                  || cargo test

# --- elixir -----------------------------------------------------------------
elixir  implementation  command -v mix                         || mix test
elixir  cleanup         command -v mix                         || mix test
elixir  cleanup         command -v mix                         || mix credo --strict
elixir  hardening       command -v mix                         || mix test
elixir  senior-implementation  command -v mix                  || mix test

# --- shell ------------------------------------------------------------------
shell  cleanup  command -v shellcheck                          || shellcheck $(git ls-files '*.sh')
